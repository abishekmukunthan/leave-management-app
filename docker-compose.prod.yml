# Production stack for leave-app.arogya.life on Web-Hosting-App1
# Compatible with older docker-compose (hyphen) on Ubuntu 18.04.
#
# Usage (from /arogya/apps/leave-app):
#   cp deploy/env.production.example .env
#   nano .env
#   docker-compose -f docker-compose.prod.yml up -d --build
#   docker-compose -f docker-compose.prod.yml run --rm backend npm run migrate

version: "2.4"

services:
  postgres:
    image: postgres:17-alpine
    container_name: leave_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - leave_app_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leave_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: abishekmukunthan/arogya-leave-backend:latest
    container_name: leave_app_backend
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SHOW_DEMO_CREDENTIALS: ${VITE_SHOW_DEMO_CREDENTIALS}
    image: abishekmukunthan/arogya-leave-frontend:latest
    container_name: leave_app_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - leave_app_network

volumes:
  leave_app_pgdata:

networks:
  leave_app_network:
    driver: bridge
