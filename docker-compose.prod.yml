# Production stack for leave-app.arogya.life on Web-Hosting-App1
# Runs alongside other Arogya microservices without claiming host :80 / :443.
#
# Usage (from /arogya/apps/leave-app):
#   cp deploy/env.production.example .env
#   nano .env
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm backend npm run migrate

services:
  postgres:
    image: postgres:17-alpine
    container_name: leave_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leave_management}
      POSTGRES_USER: ${POSTGRES_USER:-leave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - leave_app_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leave_user} -d ${POSTGRES_DB:-leave_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leave_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-abishekmukunthan/arogya-leave-backend:latest}
    container_name: leave_app_backend
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-leave_management}
      DB_USER: ${POSTGRES_USER:-leave_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-https://leave-app.arogya.life}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://leave-app.arogya.life/api}
        VITE_SHOW_DEMO_CREDENTIALS: ${VITE_SHOW_DEMO_CREDENTIALS:-false}
    image: ${FRONTEND_IMAGE:-abishekmukunthan/arogya-leave-frontend:latest}
    container_name: leave_app_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3300}:80"
    depends_on:
      - backend
    networks:
      - leave_app_network

volumes:
  leave_app_pgdata:
    driver: local

networks:
  leave_app_network:
    driver: bridge
