# Install on Web-Hosting-App1 (does not modify other domain vhosts):
#   sudo cp deploy/nginx/leave-app.arogya.life.conf /etc/nginx/sites-available/leave-app.arogya.life
#   sudo ln -sf /etc/nginx/sites-available/leave-app.arogya.life /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d leave-app.arogya.life

server {
    listen 80;
    listen [::]:80;
    server_name leave-app.arogya.life;

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
