# Install on Web-Hosting-App1 (configs load from /arogya/conf/sites/*.conf):
#   sudo cp deploy/nginx/leave.arogya.life.conf /arogya/conf/sites/leave.arogya.life.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --nginx -d leave.arogya.life
#   (then ensure SSL paths below match, or add SSL block after certbot)

server {
    listen 80;
    listen [::]:80;
    server_name leave.arogya.life;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leave.arogya.life;

    ssl_certificate /etc/letsencrypt/live/leave.arogya.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leave.arogya.life/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
